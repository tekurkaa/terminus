<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" class="banner-root">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F" />
      <stop offset="50%" stop-color="#0A0E17" />
      <stop offset="100%" stop-color="#06090F" />
    </linearGradient>

    <!-- Amber Brand Gradient -->
    <linearGradient id="amberGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="60%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1A2333" stroke-width="0.8" stroke-opacity="0.45" />
    </pattern>

    <!-- Amber Glow Filter -->
    <filter id="amberGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Intense Amber Glow Filter for Hover -->
    <filter id="amberIntenseGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur1" />
      <feGaussianBlur stdDeviation="2.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Radial Glow in Center -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.09" />
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#0A0E17" stop-opacity="0" />
    </radialGradient>

    <!-- Embedded Interactive CSS -->
    <style>
      /* Live Status Beacon Pulse */
      @keyframes beaconPulse {
        0%, 100% {
          r: 5px;
          opacity: 0.35;
        }
        50% {
          r: 10.5px;
          opacity: 0.9;
        }
      }

      .beacon-ring {
        animation: beaconPulse 2.4s ease-in-out infinite;
        transform-origin: 52px 38px;
      }

      /* Root Canvas Base */
      .banner-root {
        cursor: default;
        user-select: none;
      }

      .banner-shell {
        transition: stroke 0.4s ease, filter 0.4s ease;
      }

      .ambient-spotlight {
        transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        transform-origin: 600px 180px;
      }

      /* Central Brand Group Hover Lift & Focus */
      .brand-center-group {
        transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), filter 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        transform-origin: 600px 170px;
      }

      .brand-box {
        transition: stroke 0.35s ease, stroke-width 0.35s ease, filter 0.35s ease;
      }

      .brand-glyph {
        transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), stroke 0.3s ease, filter 0.35s ease;
      }

      .brand-title {
        transition: filter 0.4s ease;
      }

      /* Capability Tag Interactions */
      .cap-tag {
        cursor: default;
        transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
      }
      .cap-tag:hover {
        transform: translateY(-2px);
      }
      .cap-tag:hover .cap-label {
        fill: #FBBF24;
      }
      .cap-tag:hover .cap-num {
        fill: #FFFFFF;
      }

      /* Banner Canvas Hover Effects */
      .banner-root:hover .banner-shell {
        stroke: #2E3C52;
        filter: drop-shadow(0 14px 32px rgba(0, 0, 0, 0.6));
      }

      .banner-root:hover .ambient-spotlight {
        opacity: 0.18;
        transform: scale(1.06);
      }

      .banner-root:hover .brand-center-group {
        transform: translateY(-4px) scale(1.025);
      }

      .banner-root:hover .brand-box {
        stroke: #F59E0B;
        filter: drop-shadow(0 0 16px rgba(245, 158, 11, 0.4));
      }

      .banner-root:hover .brand-glyph {
        filter: url(#amberIntenseGlow);
      }

      .banner-root:hover .brand-title {
        filter: drop-shadow(0 0 18px rgba(245, 158, 11, 0.45));
      }
    </style>
  </defs>

  <!-- Base Canvas Shell -->
  <rect class="banner-shell" width="1200" height="360" rx="12" fill="url(#bgGradient)" stroke="#222C3D" stroke-width="2" />
  
  <!-- Grid Matrix Overlay -->
  <rect width="1200" height="360" rx="12" fill="url(#gridPattern)" />
  
  <!-- Center Ambient Radial Glow / Spotlight -->
  <rect class="ambient-spotlight" x="150" y="40" width="900" height="280" fill="url(#centerGlow)" opacity="0.1" />

  <!-- Top Technical Status Strip -->
  <g opacity="0.9">
    <circle cx="52" cy="38" r="4.5" fill="#10B981" />
    <circle class="beacon-ring" cx="52" cy="38" r="8" fill="#10B981" opacity="0.3" />
    <text x="68" y="42" font-family="'SF Mono', 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="2" fill="#10B981">SYS_ONLINE :: LIVE MARKET FEEDS</text>
    
    <text x="1148" y="42" text-anchor="end" font-family="'SF Mono', 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="2" fill="#64748B">NASDAQ · S&amp;P 500 · SEC EDGAR · GEMINI 3.8 FLASH</text>
    <line x1="44" y1="56" x2="1156" y2="56" stroke="#222C3D" stroke-width="1" />
  </g>

  <!-- Central Brand Entity Group (Elevates & Zooms on Hover) -->
  <g class="brand-center-group" transform="translate(185, 95)">
    <!-- Terminal Prompt Logo Badge -->
    <g transform="translate(0, 5)">
      <!-- Badge Container -->
      <rect class="brand-box" width="118" height="118" rx="24" fill="#121721" stroke="#222C3D" stroke-width="2.5" />
      <rect x="6" y="6" width="106" height="106" rx="18" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.25" />
      
      <!-- Iconic >_ Terminal Prompt Glyph -->
      <path class="brand-glyph" d="M 36 34 L 66 64 L 36 94" fill="none" stroke="#F59E0B" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" filter="url(#amberGlow)" />
      <line class="brand-glyph" x1="74" y1="94" x2="98" y2="94" stroke="#F59E0B" stroke-width="11" stroke-linecap="round" filter="url(#amberGlow)" />
    </g>

    <!-- Brand Typography Block -->
    <!-- Primary Title: TERMINUS -->
    <text class="brand-title" x="156" y="94" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="94" font-weight="900" letter-spacing="14" fill="url(#amberGradient)">TERMINUS</text>
    
    <!-- Subtitle: PERSONAL INVESTMENT COMMAND CENTER -->
    <text x="160" y="132" font-family="'SF Mono', 'IBM Plex Mono', Menlo, Monaco, Consolas, monospace" font-size="14.5" font-weight="600" letter-spacing="7.5" fill="#94A3B8">PERSONAL INVESTMENT COMMAND CENTER</text>
  </g>

  <!-- Bottom Terminal Capabilities Bar -->
  <g opacity="0.95">
    <line x1="44" y1="288" x2="1156" y2="288" stroke="#222C3D" stroke-width="1" />

    <g transform="translate(60, 318)" font-family="'SF Mono', 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600">
      <!-- Tag 1 -->
      <g class="cap-tag" transform="translate(0, 0)">
        <text class="cap-num" fill="#F59E0B">01</text>
        <text class="cap-label" x="24" fill="#CBD5E1">SUB-SECOND STREAMING</text>
      </g>

      <!-- Tag 2 -->
      <g class="cap-tag" transform="translate(265, 0)">
        <text class="cap-num" fill="#F59E0B">02</text>
        <text class="cap-label" x="24" fill="#CBD5E1">BREAKOUT RADAR &amp; DIGEST</text>
      </g>

      <!-- Tag 3 -->
      <g class="cap-tag" transform="translate(565, 0)">
        <text class="cap-num" fill="#F59E0B">03</text>
        <text class="cap-label" x="24" fill="#CBD5E1">12-FACTOR ALPHA SIGNALS</text>
      </g>

      <!-- Tag 4 -->
      <g class="cap-tag" transform="translate(845, 0)">
        <text class="cap-num" fill="#F59E0B">04</text>
        <text class="cap-label" x="24" fill="#CBD5E1">GEMINI 3.8 FLASH REASONING</text>
      </g>
    </g>
  </g>
</svg>
