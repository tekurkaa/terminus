<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F" />
      <stop offset="50%" stop-color="#0A0E17" />
      <stop offset="100%" stop-color="#06090F" />
    </linearGradient>

    <!-- Amber Brand Gradient -->
    <linearGradient id="amberGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="60%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1A2333" stroke-width="0.8" stroke-opacity="0.45" />
    </pattern>

    <!-- Amber Glow Filter -->
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Radial Glow in Center -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#0A0E17" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Canvas Shell -->
  <rect width="1200" height="360" rx="12" fill="url(#bgGradient)" stroke="#222C3D" stroke-width="2" />
  
  <!-- Grid Matrix Overlay -->
  <rect width="1200" height="360" rx="12" fill="url(#gridPattern)" />
  
  <!-- Center Ambient Radial Glow -->
  <rect x="150" y="40" width="900" height="280" fill="url(#centerGlow)" />

  <!-- Top Technical Status Strip -->
  <g opacity="0.9">
    <circle cx="52" cy="38" r="4.5" fill="#10B981" />
    <circle cx="52" cy="38" r="8" fill="#10B981" opacity="0.25" />
    <text x="68" y="42" font-family="'SF Mono', 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="2" fill="#10B981">SYS_ONLINE :: LIVE MARKET FEEDS</text>
    
    <text x="1148" y="42" text-anchor="end" font-family="'SF Mono', 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="2" fill="#64748B">NASDAQ · S&amp;P 500 · SEC EDGAR · GEMINI 3.8 FLASH</text>
    <line x1="44" y1="56" x2="1156" y2="56" stroke="#222C3D" stroke-width="1" />
  </g>

  <!-- Central Brand Entity Group -->
  <g transform="translate(185, 95)">
    <!-- Terminal Prompt Logo Badge -->
    <g transform="translate(0, 5)">
      <!-- Badge Container -->
      <rect width="118" height="118" rx="24" fill="#121721" stroke="#222C3D" stroke-width="2.5" />
      <rect x="6" y="6" width="106" height="106" rx="18" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.25" />
      
      <!-- Iconic >_ Terminal Prompt Glyph -->
      <path d="M 36 34 L 66 64 L 36 94" fill="none" stroke="#F59E0B" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" filter="url(#amberGlow)" />
      <line x1="74" y1="94" x2="98" y2="94" stroke="#F59E0B" stroke-width="11" stroke-linecap="round" filter="url(#amberGlow)" />
    </g>

    <!-- Brand Typography Block -->
    <!-- Primary Title: TERMINUS -->
    <text x="156" y="94" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="94" font-weight="900" letter-spacing="14" fill="url(#amberGradient)">TERMINUS</text>
    
    <!-- Subtitle: PERSONAL INVESTMENT COMMAND CENTER -->
    <text x="160" y="132" font-family="'SF Mono', 'IBM Plex Mono', Menlo, Monaco, Consolas, monospace" font-size="14.5" font-weight="600" letter-spacing="7.5" fill="#94A3B8">PERSONAL INVESTMENT COMMAND CENTER</text>
  </g>

  <!-- Bottom Terminal Capabilities Bar -->
  <g opacity="0.95">
    <line x1="44" y1="288" x2="1156" y2="288" stroke="#222C3D" stroke-width="1" />

    <g transform="translate(60, 318)" font-family="'SF Mono', 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#94A3B8">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <text fill="#F59E0B">01</text>
        <text x="24" fill="#CBD5E1">SUB-SECOND STREAMING</text>
      </g>

      <!-- Tag 2 -->
      <g transform="translate(265, 0)">
        <text fill="#F59E0B">02</text>
        <text x="24" fill="#CBD5E1">BREAKOUT RADAR &amp; DIGEST</text>
      </g>

      <!-- Tag 3 -->
      <g transform="translate(565, 0)">
        <text fill="#F59E0B">03</text>
        <text x="24" fill="#CBD5E1">12-FACTOR ALPHA SIGNALS</text>
      </g>

      <!-- Tag 4 -->
      <g transform="translate(845, 0)">
        <text fill="#F59E0B">04</text>
        <text x="24" fill="#CBD5E1">GEMINI 3.8 FLASH REASONING</text>
      </g>
    </g>
  </g>
</svg>
